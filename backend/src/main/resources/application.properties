spring.application.name=bucketly-api

# Server Port
server.port=${SERVER_PORT:8080}

# Database Connection (Environment-driven with local fallback)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/bucketly?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Conservative JPA / Hibernate Settings
# 'none': Hibernate does not create, alter, or drop tables automatically.
# 'show-sql=false': Avoids verbose query logging and credential leaks in console.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT Configuration (Environment-driven; no hardcoded secret fallback)
bucketly.jwt.secret=${BUCKETLY_JWT_SECRET:${JWT_SECRET:}}
bucketly.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Photo Storage Configuration
bucketly.photo.upload-dir=${BUCKETLY_PHOTO_UPLOAD_DIR:uploads/memories}

# Multipart Upload Limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB